 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub - Academy Edition (v1.7)</title>
    <!-- Google Fonts: Inter y Montserrat para estilo Shonen / Deportivo -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Carga de estilos correcta -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 id="app-title">Study Hub Academy</h1>
        <div class="subtitle">Ego & Performance System v1.7</div>
    </header>

    <div class="container">
        <!-- Estado de Carga -->
        <div id="loading-view" class="loading">
            Cargando configuración táctica y banco de reactivos...
        </div>

        <!-- Pantalla de Error de Red con Reintento (TASK-501) -->
        <div id="error-view" class="error-box hidden">
            <p id="error-message">No se pudo establecer conexión con el servidor central de Google Sheets.</p>
            <button class="btn" onclick="initApp()">Reintentar Conexión</button>
        </div>

        <!-- Selector de Materias -->
        <div id="subjects-view" class="hidden">
            <h2 style="margin-bottom: 15px; font-size: 1.3rem;">Selecciona tu Materia</h2>
            <div id="subjects-grid" class="subjects-grid"></div>
        </div>

        <!-- Contenedor del Cuestionario -->
        <div id="quiz-view" class="hidden">
            <div class="quiz-header">
                <span id="quiz-subject-title" style="font-weight: 700; color: var(--accent-blue);">Materia</span>
                <button class="btn" style="margin-top: 0; padding: 6px 12px; font-size: 0.8rem; background: var(--border-color);" onclick="confirmLeaveQuiz()">Cambiar Materia</button>
            </div>
            <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px;" id="question-progress">Pregunta 1 de 10</div>
            <div class="question-text" id="question-container">Cargando pregunta...</div>
            <div class="options-list" id="options-container"></div>
        </div>

        <!-- Pantalla de Resultados -->
        <div id="results-view" class="hidden results-box">
            <h2>¡Entrenamiento Finalizado!</h2>
            <div class="score-display" id="final-score">0 / 0</div>
            <p id="results-feedback" style="color: var(--text-muted); margin-bottom: 20px;"></p>
            <button class="btn" onclick="showSubjectsView()">Volver al Menú Principal</button>
        </div>
    </div>
</body>

<!-- Carga del script correcta -->
<script src="app.js" defer></script>

</html>
