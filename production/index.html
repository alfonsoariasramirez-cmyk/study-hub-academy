 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub - Academy Edition (v1.7)</title>
    <!-- Google Fonts: Inter y Montserrat para estilo Shonen / Deportivo -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #131b2e;
            --accent-blue: #00d2ff;
            --accent-red: #ff3366;
            --accent-yellow: #ffcc00;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 2.2rem;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .loading, .error-box {
            text-align: center;
            padding: 40px;
            font-size: 1.1rem;
        }

        .error-box {
            color: var(--accent-red);
        }

        .btn {
            background: linear-gradient(135deg, #0070f3, var(--accent-blue));
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            margin-top: 15px;
            min-height: 48px;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 210, 255, 0.3);
        }

        /* Grid de Materias */
        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .subject-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .subject-card:hover {
            border-color: var(--accent-blue);
            background: rgba(0, 210, 255, 0.05);
            transform: translateY(-3px);
        }

        .subject-icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .subject-name {
            font-weight: 600;
            font-size: 1rem;
        }

        /* Pantalla de Cuestionario */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 10px;
            color: var(--text-main);
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 55px; /* Optimización táctil móvil */
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-blue);
        }

        .option-btn.correct {
            background: rgba(0, 255, 128, 0.2);
            border-color: #00ff80;
        }

        .option-btn.incorrect {
            background: rgba(255, 51, 102, 0.2);
            border-color: var(--accent-red);
        }

        .hidden {
            display: none !important;
        }

        /* Panel de Resultados */
        .results-box {
            text-align: center;
            padding: 20px;
        }

        .score-display {
            font-size: 3rem;
            font-family: 'Montserrat', sans-serif;
            color: var(--accent-yellow);
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="app-title">Study Hub Academy</h1>
        <div class="subtitle">Ego & Performance System v1.7</div>
    </header>

    <div class="container">
        <!-- Estado de Carga -->
        <div id="loading-view" class="loading">
            Cargando configuración táctica y banco de reactivos...
        </div>

        <!-- Pantalla de Error de Red con Reintento (TASK-501) -->
        <div id="error-view" class="error-box hidden">
            <p id="error-message">No se pudo establecer conexión con el servidor central de Google Sheets.</p>
            <button class="btn" onclick="initApp()">Reintentar Conexión</button>
        </div>

        <!-- Selector de Materias -->
        <div id="subjects-view" class="hidden">
            <h2 style="margin-bottom: 15px; font-size: 1.3rem;">Selecciona tu Materia</h2>
            <div id="subjects-grid" class="subjects-grid"></div>
        </div>

        <!-- Contenedor del Cuestionario -->
        <div id="quiz-view" class="hidden">
            <div class="quiz-header">
                <span id="quiz-subject-title" style="font-weight: 700; color: var(--accent-blue);">Materia</span>
                <button class="btn" style="margin-top: 0; padding: 6px 12px; font-size: 0.8rem; background: var(--border-color);" onclick="confirmLeaveQuiz()">Cambiar Materia</button>
            </div>
            <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px;" id="question-progress">Pregunta 1 de 10</div>
            <div class="question-text" id="question-container">Cargando pregunta...</div>
            <div class="options-list" id="options-container"></div>
        </div>

        <!-- Pantalla de Resultados -->
        <div id="results-view" class="hidden results-box">
            <h2>¡Entrenamiento Finalizado!</h2>
            <div class="score-display" id="final-score">0 / 0</div>
            <p id="results-feedback" style="color: var(--text-muted); margin-bottom: 20px;"></p>
            <button class="btn" onclick="showSubjectsView()">Volver al Menú Principal</button>
        </div>
    </div>

    <script>
        // URL de publicación CSV del AppConfig oficial (v1.4 - v1.7)
        const APP_CONFIG_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRGBmoGizzNKU8G5AAHx0B7X929ljOcclcnx7enTgDLixnaJ3Xn61buqcb8BkRGTt16qIUjQQKFIJch/pub?gid=0&single=true&output=csv";

        let subjectsCatalog = [];
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let activeQuizSubject = "";

        // Motor robusto de parseo CSV compatible con comillas y comas internas
        function parseCSV(text) {
            let lines = [];
            let row = [""];
            let insideQuotes = false;
            
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let nextC = text[i + 1];
                
                if (c === '"' && insideQuotes && nextC === '"') {
                    row[row.length - 1] += '"';
                    i++;
                } else if (c === '"') {
                    insideQuotes = !insideQuotes;
                } else if (c === ',' && !insideQuotes) {
                    row.push("");
                } else if ((c === '\r' || c === '\n') && !insideQuotes) {
                    if (c === '\r' && nextC === '\n') { i++; }
                    lines.push(row);
                    row = [""];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== "") {
                lines.push(row);
            }
            return lines;
        }

        async function initApp() {
            showView('loading-view');
            try {
                // Control de caché con timestamp dinámico (TASK-504)
                const cacheBuster = `&_t=${new Date().getTime()}`;
                const response = await fetch(APP_CONFIG_URL + cacheBuster);
                if (!response.ok) throw new Error("Error HTTP: " + response.status);
                
                const csvText = await response.text();
                const rows = parseCSV(csvText);
                
                subjectsCatalog = [];
                // Omitir cabecera (fila 0)
                for (let i = 1; i < rows.length; i++) {
                    const r = rows[i];
                    if (r.length >= 5 && r[0].trim() === "Subject") {
                        subjectsCatalog.push({
                            key: r[1].trim(),
                            name: r[2].trim(),
                            icon: r[3].trim(),
                            url: r[4].trim()
                        });
                    } else if (r.length >= 3 && r[0].trim() === "Setting" && r[1].trim() === "AppTitle") {
                        document.getElementById("app-title").innerText = r[2].trim();
                    }
                }

                if (subjectsCatalog.length === 0) {
                    throw new Error("No se encontraron materias en el archivo de configuración.");
                }

                renderSubjects();
                showView('subjects-view');
            } catch (err) {
                console.error("Fallo de red o parseo:", err);
                showView('error-view');
            }
        }

        function showView(viewId) {
            ['loading-view', 'error-view', 'subjects-view', 'quiz-view', 'results-view'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
        }

        function renderSubjects() {
            const grid = document.getElementById("subjects-grid");
            grid.innerHTML = "";
            subjectsCatalog.forEach(sub => {
                const card = document.createElement("div");
                card.className = "subject-card";
                card.innerHTML = `
                    <div class="subject-icon">${sub.icon}</div>
                    <div class="subject-name">${sub.name}</div>
                `;
                card.onclick = () => loadSubjectQuiz(sub);
                grid.appendChild(card);
            });
        }

        async function loadSubjectQuiz(subject) {
            activeQuizSubject = subject.name;
            showView('loading-view');
            try {
                const cacheBuster = `&_t=${new Date().getTime()}`;
                const response = await fetch(subject.url + cacheBuster);
                if (!response.ok) throw new Error("No se pudo cargar el banco de preguntas.");
                
                const csvText = await response.text();
                const rows = parseCSV(csvText);
                
                currentQuestions = [];
                // Formato esperado: Category,Question,Option A,Option B,Option C,Correct Answer,Explanation,Difficulty,Activity_Type
                for (let i = 1; i < rows.length; i++) {
                    const r = rows[i];
                    if (r.length >= 6 && r[1].trim() !== "") {
                        currentQuestions.push({
                            category: r[0].trim(),
                            question: r[1].trim(),
                            options: [r[2].trim(), r[3].trim(), r[4].trim()].filter(opt => opt !== ""),
                            correctAnswer: r[5].trim()
                        });
                    }
                }

                if (currentQuestions.length === 0) {
                    alert("Esta materia aún no tiene preguntas configuradas.");
                    showSubjectsView();
                    return;
                }

                // Barajar preguntas aleatoriamente
                currentQuestions.sort(() => Math.random() - 0.5);
                currentQuestionIndex = 0;
                score = 0;

                document.getElementById("quiz-subject-title").innerText = subject.name;
                showView('quiz-view');
                renderQuestion();
            } catch (err) {
                console.error(err);
                alert("Error al cargar las preguntas de la materia.");
                showSubjectsView();
            }
        }

        function renderQuestion() {
            if (currentQuestionIndex >= currentQuestions.length || currentQuestionIndex >= 10) {
                showResults();
                return;
            }

            const q = currentQuestions[currentQuestionIndex];
            document.getElementById("question-progress").innerText = `Pregunta ${currentQuestionIndex + 1} de ${Math.min(10, currentQuestions.length)}`;
            document.getElementById("question-container").innerText = q.question;

            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            // Barajar opciones
            let shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => selectAnswer(opt, q.correctAnswer, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectAnswer(selected, correct, btnElement) {
            // Deshabilitar botones para evitar doble clic
            const buttons = document.querySelectorAll(".option-btn");
            buttons.forEach(b => b.onclick = null);

            // Normalización para comparar respuestas sin tildes o mayúsculas (TASK-201)
            const cleanSelected = selected.normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
            const cleanCorrect = correct.normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();

            if (cleanSelected === cleanCorrect) {
                btnElement.classList.add("correct");
                score++;
            } else {
                btnElement.classList.add("incorrect");
                buttons.forEach(b => {
                    const cleanB = b.innerText.normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
                    if (cleanB === cleanCorrect) {
                        b.classList.add("correct");
                    }
                });
            }

            setTimeout(() => {
                currentQuestionIndex++;
                renderQuestion();
            }, 1200);
        }

        function showResults() {
            showView('results-view');
            const total = Math.min(10, currentQuestions.length);
            document.getElementById("final-score").innerText = `${score} / ${total}`;
            
            let feedback = "¡Buen trabajo! Sigue practicando para dominar la materia.";
            if (score === total) feedback = "¡Rendimiento perfecto! Nivel Ego Estelar alcanzado ⚽🔥";
            else if (score >= total * 0.8) feedback = "¡Excelente desempeño! Estás listo para el torneo.";
            
            document.getElementById("results-feedback").innerText = feedback;
        }

        // Prevención de pérdida de sesión al cambiar de materia por accidente (TASK-503)
        function confirmLeaveQuiz() {
            if (confirm("¿Estás seguro de que deseas salir? Perderás el progreso de tu cuestionario actual.")) {
                showSubjectsView();
            }
        }

        function showSubjectsView() {
            showView('subjects-view');
        }

        // Inicializar al cargar la página
        window.onload = initApp;
    </script>
</body>
</html>
